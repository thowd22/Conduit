# Conduit CI: build and unit-test Conduit on every OS Conduit ships.
#
# The Zig version is not written here. `build.zig.zon` is the one source of
# truth for it, and the "Resolve the pinned Zig version" step below reads
# `.minimum_zig_version` out of that file and publishes it as `$ZIG_VERSION`
# for every later step, including the cache key. Nothing in this workflow
# restates the version, so the pin cannot drift from the toolchain.
name: CI

on:
  push:
    # Branch pushes only: a release tag runs this gate through release.yml
    # (workflow_call) instead of a second standalone copy.
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# The workflow only reads the repository.
permissions:
  contents: read

# One run per ref at a time, and a started run is never cancelled. A cold
# macOS or Windows leg takes long enough that main used to receive its next
# push first, and with `cancel-in-progress: true` every push cancelled the
# matrix, so the macOS leg never finished once (TASK-5). With it false, GitHub
# lets the running matrix finish and keeps only the newest push queued behind
# it (an older pending run is replaced), so every leg of the latest queued
# commit still reports and nothing piles up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Bounded: a cold leg builds SDL, FreeType, HarfBuzz, Oniguruma and the
    # terminal engine from source (about seven minutes on macOS) before the
    # tests, and the test step has its own, tighter bound below so a hung
    # test fails that step instead of eating the whole job.
    timeout-minutes: 75
    strategy:
      # One OS failing should not hide the other two; every leg reports.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Read the pin rather than repeat it. `sed -E` is portable across GNU,
      # BSD and Git-for-Windows sed; the capture stops at the closing quote, so
      # a CRLF checkout cannot smuggle a carriage return into the version.
      - name: Resolve the pinned Zig version
        shell: bash
        run: |
          version="$(sed -nE 's/^[[:space:]]*\.minimum_zig_version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' build.zig.zon)"
          if [ -z "$version" ]; then
            echo "::error::build.zig.zon declares no .minimum_zig_version" >&2
            exit 1
          fi
          echo "ZIG_VERSION=$version" >> "$GITHUB_ENV"
          echo "Zig version pinned by build.zig.zon: $version"

      - name: Install Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          # Caching is the "Restore the Zig caches" step's job, with keys this
          # workflow owns. (setup-zig's input is `use-cache`; while it was left
          # on, setup-zig also cached `.zig-cache` and pointed the global cache
          # into it, so two caches stored the same artifacts.)
          use-cache: false

      # The pin is only worth anything if the toolchain on the runner is the one
      # the pin names, so state the two side by side and fail when they differ.
      - name: Check the installed Zig against the pin
        shell: bash
        run: |
          installed="$(zig version)"
          if [ "$installed" != "$ZIG_VERSION" ]; then
            echo "::error::installed Zig $installed does not match the pinned $ZIG_VERSION" >&2
            exit 1
          fi
          echo "zig: $installed ($ZIG_VERSION), global cache ${ZIG_GLOBAL_CACHE_DIR:-default}"

      # setup-zig points both Zig caches at `.zig-cache` in the workspace on
      # every OS (even with `use-cache: false`), and Zig 0.16 unpacks fetched
      # packages into `zig-pkg`, so these repo-relative paths are the whole of
      # it on all three runners.
      #
      # `runner.os` is Linux/macOS/Windows, so legs cannot share an entry, and
      # the version sits in the key, so two Zig versions cannot either. The
      # source hash rotates the key when the build or the pins change; the
      # restore-keys fall back to the same OS and version, then the same OS, so
      # a changed pin or a cold cache is paid for once, not twice.
      - name: Restore the Zig caches and the fetched dependencies
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-out
            zig-pkg
          key: conduit-${{ runner.os }}-zig-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            conduit-${{ runner.os }}-zig-${{ env.ZIG_VERSION }}-
            conduit-${{ runner.os }}-zig-

      # The terminal tests drive a real tmux; the Linux image ships it and the
      # macOS image does not. On Windows those tests skip with the POSIX PTY.
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: brew install tmux

      - name: Check formatting
        shell: bash
        run: zig fmt --check .

      - name: Build
        shell: bash
        run: zig build

      # `zig build test` runs the unit tests of every Conduit module and exits
      # non-zero if any of them fail, so a failing test fails the step, fails
      # the job, and fails this workflow. Nothing here masks that: the step has
      # no `continue-on-error`, no `if:` that skips it, and no `|| true`.
      - name: Unit tests
        shell: bash
        timeout-minutes: 40
        run: zig build test --summary all

      # On a failed macOS or Windows leg, which nobody can reproduce on the
      # Linux dev box, run each test binary directly, outside the build
      # runner's protocol, so every test's name and outcome is printed and a
      # hang names the test it hung in (each binary gets 240 s). Diagnosis
      # only: the job has already failed by the time this runs.
      - name: Diagnose failing tests
        if: failure() && runner.os != 'Linux'
        shell: bash
        run: |
          # A step that timed out leaves whatever held it behind: on Windows, list the
          # processes still alive (a test binary, or a child or conhost it orphaned that keeps
          # the build runner's pipe open) before anything else starts.
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -Command "Get-CimInstance Win32_Process | Where-Object { \$_.Name -match 'test|conhost|cmd|powershell|zig|sh' } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-Table -AutoSize -Wrap | Out-String -Width 400" || true
          fi
          for name in platform pty config font link state version theme term render ui input palette session workspace agent backlog testdriver control app conduit-test conduit-e2e; do
            bin="$(ls -t $(find .zig-cache/o -type f \( -name "$name-test" -o -name "$name-test.exe" \)) 2>/dev/null | head -n 1)"
            [ -n "$bin" ] || { echo "== $name-test: no binary"; continue; }
            echo "== $name-test ($bin)"
            perl -e 'alarm shift; exec @ARGV or die "exec: $!"' 240 "$bin" > diag.txt 2>&1 || echo "== $name-test exited $?"
            tail -n 300 diag.txt
          done
